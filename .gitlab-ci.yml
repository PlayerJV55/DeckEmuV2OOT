workflow:
  rules:
    - if: '$CI_COMMIT_TAG'
    - when: never

stages:
  - build
  - release

linux_appimage:
  stage: build
  image: ubuntu:24.04
  tags:
    - saas-linux-medium-amd64
  timeout: 3h
  resource_group: linux-appimage-amd64
  retry:
    max: 1
    when:
      - runner_system_failure
  variables:
    GIT_DEPTH: "0"
    GIT_SUBMODULE_STRATEGY: "none"
    BUILD_JOBS: "4"
    CCACHE_DIR: "$CI_PROJECT_DIR/.cache/ccache-linux-amd64"
    CCACHE_BASEDIR: "$CI_PROJECT_DIR"
    CCACHE_COMPILERCHECK: "content"
    CCACHE_MAXSIZE: "3G"
    RUNNER_SCRIPT_TIMEOUT: 2h40m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    CACHE_COMPRESSION_LEVEL: fastest
  cache:
    - key: linux-amd64-noble-gcc13-qt683-ccache-v1
      paths:
        - .cache/ccache-linux-amd64/
      when: always
    - key:
        files:
          - cpmfile.json
        prefix: linux-amd64-noble-cpm-v1
      paths:
        - .cache/cpm/
      when: always
    - key: linux-amd64-qt683-appimage-tools-v1
      paths:
        - .cache/qt-linux/
        - .cache/appimage-tools/
      when: always
  script:
    - sh tools/linux/ci-appimage.sh
  artifacts:
    name: "nemyu-linux-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - out/linux-x86_64/BUILDINFO.txt
      - out/linux-x86_64/SHA256SUMS
      - out/linux-x86_64/DOWNLOAD.md
      - out/linux-x86_64/GUI-SMOKE.log
      - out/linux-x86_64/CLI-SMOKE.log
      - out/linux-x86_64/release.json
      - build-linux/CMakeCache.txt
      - build-linux/CMakeFiles/CMakeConfigureLog.yaml

windows_build:
  stage: build
  timeout: 3h
  resource_group: windows-msvc-amd64
  retry:
    max: 1
    when:
      - runner_system_failure
    exit_codes:
      - 75
  tags:
    - saas-windows-medium-amd64
  variables:
    GIT_DEPTH: "0"
    RUNNER_SCRIPT_TIMEOUT: 2h50m
    RUNNER_AFTER_SCRIPT_TIMEOUT: 5m
    CACHE_COMPRESSION_LEVEL: fastest
  # The compiler cache and CPM's downloads carry over to the next pipeline, also from a failed job:
  # ci-release.ps1 stops a build that would hit the time limit so its objects are kept.
  cache:
    - key: windows-msvc-sccache
      paths:
        - .sccache/
      when: always
    - key:
        files:
          - cpmfile.json
        prefix: cpm
      paths:
        - .cache/cpm/
      when: always
    - key: windows-msvc-qt6102-tools-v1
      paths:
        - .cache/qt-msvc/
        - .cache/ci-git/
        - .cache/ci-sccache/
      when: always
  script:
    - powershell.exe -NoProfile -ExecutionPolicy Bypass -File .\tools\windows\ci-release.ps1
  artifacts:
    name: "nemyu-windows-$CI_COMMIT_SHORT_SHA-$CI_PIPELINE_ID"
    when: always
    expire_in: 30 days
    paths:
      - out/windows-x86_64/
      - build/CMakeCache.txt
      - build/CMakeFiles/CMakeConfigureLog.yaml

publish_release:
  stage: release
  image: registry.gitlab.com/gitlab-org/cli:v1.126.0
  tags:
    - saas-linux-small-amd64
  timeout: 20m
  retry: 1
  resource_group: "release-$CI_COMMIT_REF_SLUG"
  needs:
    - job: linux_appimage
      artifacts: true
    - job: windows_build
      artifacts: true
  variables:
    GIT_DEPTH: "0"
    GLAB_ENABLE_CI_AUTOLOGIN: "true"
  script:
    - sh tools/publish-gitlab-release.sh
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - out/release-notes.md
      - out/release-links.json
